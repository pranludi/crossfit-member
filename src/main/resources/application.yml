spring:
  application:
    name: member service
  datasource:
    hikari:
      driver-class-name: org.h2.Driver
#      jdbc-url: 'jdbc:h2:mem:member'
      jdbc-url: 'jdbc:h2:tcp://localhost/~/member'
      username: member
      password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        show-sql: true
        format_sql: true
  grpc:
    server:
      port: 8081
